{% set name = "opentelemetry-instrumentation-bedrock" %}
{% set version = "0.57.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 5632feb835c4f03aa81823788557d6b2f45f70da6d4de6ff8a5a61eaf5bd0e1b

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - opentelemetry-api >=1.38.0,<2.0.0
    - opentelemetry-instrumentation >=0.59b0
    - opentelemetry-semantic-conventions >=0.59b0
    - opentelemetry-semantic-conventions-ai >=0.5.1,<0.6.0
  run_constrained:
    - boto3 >=1.34.120,<2.0.0
    - anthropic >=0.17.0

# Unable to run the tests, opentelemetry-test-utils is not in the main channel. No module named 'opentelemetry.test'.
test:
  imports:
    - opentelemetry.instrumentation.bedrock
  commands:
    - pip check
  requires:
    - pip
    - boto3 >=1.34.120,<2.0.0

about:
  home: https://www.traceloop.com/openllmetry
  summary: OpenTelemetry Bedrock instrumentation
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  description: |
    This library allows tracing any of AWS Bedrock's models prompts and completions sent with Boto3 to Bedrock.
  dev_url: https://github.com/traceloop/openllmetry
  doc_url: https://www.traceloop.com/docs/openllmetry/introduction

extra:
  recipe-maintainers:
    - timkpaine
  skip-lints:
    - invalid_url
